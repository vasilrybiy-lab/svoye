name: SVOE site QA (no external calls)

on:
  push:
    branches:
      - "qa/**"
      - "fix/**"
  pull_request:
    branches:
      - "feature/v2-svoe-live-telegram-2026-10-16"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies (without lifecycle scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run isolated contract checks
        run: node --test tests/*.test.cjs
      - name: Build full Next.js site without release secrets
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: HTTP smoke-check built pages and disabled website handoff
        shell: bash
        env:
          SVOYE_HANDOFF_BOT_READY: "false"
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          set -euo pipefail
          ./node_modules/.bin/next start --hostname 127.0.0.1 --port 4317 >/tmp/svoe-next-qa.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 35); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:4317/; then break; fi
            sleep 1
          done
          for route in / /approach /parents /about /korysne /reviews /kudy-vstupaty /yak-obraty-spetsialnist /yak-dopomohty-dytyni /ikigai-dlya-pidlitkiv /pytannya-dlya-rozmovy; do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:4317${route}")
            if [ "$status" != "200" ]; then
              echo "HTTP route ${route} returned ${status}"
              exit 1
            fi
          done
          curl --fail --silent http://127.0.0.1:4317/robots.txt | grep -Fq 'Sitemap: https://svoe.live/sitemap.xml'
          curl --fail --silent http://127.0.0.1:4317/sitemap.xml | grep -Fq '<loc>https://svoe.live/</loc>'
          curl --fail --silent http://127.0.0.1:4317/api/website-handoff |
            node -e 'let b="";process.stdin.on("data",c=>b+=c);process.stdin.on("end",()=>{const x=JSON.parse(b);if(x.enabled!==false)process.exit(1);console.log("Handoff safely disabled")})'
          echo "Site HTML routes, sitemap and fail-closed handoff: PASS"
      - name: Public svoe.live GET-only smoke (no credentials)
        shell: bash
        run: |
          set -euo pipefail
          root=$(mktemp)
          curl --fail --silent --show-error --location --retry 2 --retry-delay 2 --connect-timeout 8 --max-time 25 https://svoe.live/ -o "$root"
          grep -Eq 'id="contact"|id=\\"contact\\"' "$root"
          grep -Eq 'id="trials"|id=\\"trials\\"' "$root"
          for route in /approach /parents /about /korysne /reviews; do
            code=$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' --connect-timeout 8 --max-time 25 "https://svoe.live${route}")
            test "$code" = "200" || { echo "Public HTTP failure ${route}: ${code}"; exit 1; }
          done
          curl --fail --silent --show-error --location --connect-timeout 8 --max-time 25 https://svoe.live/api/website-handoff |
            node -e 'let d="";process.stdin.on("data",b=>d+=b);process.stdin.on("end",()=>{if(JSON.parse(d).enabled!==false)process.exit(1);console.log("Public handoff still disabled: PASS")})'
          code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --connect-timeout 8 --max-time 25 https://www.svoe.live/)
          test "$code" = "308" || { echo "Unexpected www redirect: $code"; exit 1; }
          echo "Public HTTPS home, anchors, inner pages, disabled handoff, WWW redirect: PASS"
